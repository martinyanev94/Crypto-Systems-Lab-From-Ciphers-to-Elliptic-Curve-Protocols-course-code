[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secp256k1-signature-lab"
version = "0.1.0"
description = "A deliberately small educational ECDSA artifact lab"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
